# Installed by `cubby-server fail2ban enable`. Tells Cubby about each ban and unban (for the Security tab) by having
# cubby-server drop an event file where the container reads it.

[Definition]
actionban = <cubby_bin> fail2ban event ban <ip> <name> <bantime>
actionunban = <cubby_bin> fail2ban event unban <ip> <name>

[Init]
cubby_bin = /usr/local/bin/cubby-server
