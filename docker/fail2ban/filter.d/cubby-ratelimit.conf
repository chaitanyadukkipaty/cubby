# Installed by `cubby-server fail2ban enable`. Responses where Cubby's login/signup rate limit turned a client away
# (429). Matches Caddy's JSON access log (docker/entrypoint.sh); tests/unit/fail2ban-filters.test.js runs the regex.

[Definition]
failregex = "client_ip":"<HOST>",.*"status":429[,}]
ignoreregex =
