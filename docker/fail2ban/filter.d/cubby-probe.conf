# Installed by `cubby-server fail2ban enable`. Requests only a vulnerability scanner makes: Cubby never serves PHP,
# dotfiles or the admin pages of other software, and browsers never send "..". Matches Caddy's JSON access log
# (docker/entrypoint.sh), where quotes inside the URI are escaped, so a URI can't forge the client_ip field.
# Keep the regex to syntax Python and JavaScript read the same way (a leading (?i) is the only flag):
# tests/unit/fail2ban-filters.test.js runs it.

[Definition]
failregex = (?i)"client_ip":"<HOST>",.*?"uri":"[^"?]*?(?:/\.(?:env|git|svn|hg|aws|ssh|docker|s3cfg|ds_store|htaccess|htpasswd|vscode)(?=[/.?"])|\.php\d?(?=[/?"])|/wp-(?:admin|content|includes|login)|/(?:xmlrpc|phpmyadmin|phpinfo|pma|cgi-bin|actuator|server-status|boaform|hnap1|_profiler)(?=[/.?"])|/vendor/phpunit/|/(?:\.\.|%%2e%%2e)/)
ignoreregex =
