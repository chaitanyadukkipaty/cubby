# Installed by `cubby-server fail2ban enable`; replaced on every enable and upgrade, so change it there.
# Cubby's ports are published by Docker, so web traffic never passes the host's INPUT chain: bans go in DOCKER-USER,
# which Docker keeps first in FORWARD. After DNAT the destination port is the container's (80/443), whatever host port
# Cubby is published on. Bans are web-only; SSH has its own stock jail.

[cubby-probe]
enabled = true
filter = cubby-probe
logpath = __LOG__
backend = auto
port = http,https
chain = DOCKER-USER
banaction = iptables-multiport
# 172.16.0.0/12 holds Docker's bridge networks: requests docker-proxy forwards (IPv6 clients) come from there.
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
action = %(action_)s
         cubby-events[cubby_bin="__CUBBY_BIN__"]
# Repeat offenders: each new ban doubles, as jail.conf suggests.
bantime.increment = true

[cubby-ratelimit]
enabled = true
filter = cubby-ratelimit
logpath = __LOG__
backend = auto
port = http,https
chain = DOCKER-USER
banaction = iptables-multiport
# 172.16.0.0/12 holds Docker's bridge networks: requests docker-proxy forwards (IPv6 clients) come from there.
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
action = %(action_)s
         cubby-events[cubby_bin="__CUBBY_BIN__"]
bantime.increment = true
# Cubby's login limit (10/min per IP) can turn away a group signing up together from one network; a brute force
# sends hundreds of attempts. 30 rejections in findtime tells them apart.
maxretry = 30
