<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Filled in per request by server/src/dashboard.js; js/session.js reads them. -->
<meta name="cubby-server" content="{{PUBLIC_URL}}">
<meta name="cubby-version" content="{{VERSION}}">
<title>Cubby</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9480f'/%3E%3Ccircle cx='16' cy='17' r='7' fill='%23fff'/%3E%3C/svg%3E">
<!-- Apply a saved theme before the stylesheet paints, so a dark choice never flashes light. -->
<script>try { var t = localStorage.getItem('cubby_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="{{ASSETS}}/app.css">
<script type="module" src="{{ASSETS}}/js/main.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:24px">The Cubby dashboard needs JavaScript.</p></noscript>
</body>
</html>
