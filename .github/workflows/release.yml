name: Release

# Publishes a release when main's package.json version has no vX.Y.Z tag yet. The maintainer decides to release by
# merging a release PR (see CONTRIBUTING.md "Releases"); nobody pushes tags by hand. Runs on the push to main, without
# waiting for CI there: CI skips release commits on main, because the release PR's own run already tested exactly this
# code. "Verify" proves that before tagging (scripts/release.mjs verifyTested) and refuses otherwise.
# v* tags are protected by the "Release tags" ruleset: the tag is pushed over SSH with the RELEASE_DEPLOY_KEY deploy
# key (a ruleset bypass actor); the GitHub Release is then created for that existing tag with GITHUB_TOKEN.

on:
  push:
    branches: [main]
  # By hand, the maintainer vouches for main instead of Verify (e.g. after fixing a refused release).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    if: github.repository == 'chaitanyadukkipaty/cubby'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --list 'v*' > tags.txt
          gh release list --limit 200 --json tagName --jq '.[].tagName' > releases.txt
          node scripts/release.mjs plan --tags tags.txt --releases releases.txt --notes release-notes.md

      # Only a merged PR whose head had this exact tree and passed every required check may be released.
      - name: Verify
        if: steps.plan.outputs.action == 'release' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" > prs.json
          pr="$(jq -r --arg sha "${{ github.sha }}" '[.[] | select(.merge_commit_sha == $sha)][0].number // empty' prs.json)"
          head="$(jq -r --arg sha "${{ github.sha }}" '[.[] | select(.merge_commit_sha == $sha)][0].head.sha // empty' prs.json)"
          head_tree=""
          if [[ -n "$pr" ]] && git fetch -q origin "refs/pull/$pr/head" && [[ "$(git rev-parse FETCH_HEAD)" == "$head" ]]; then
            head_tree="$(git rev-parse "$head^{tree}")"
            gh api --paginate "repos/${{ github.repository }}/commits/$head/check-runs" --jq '.check_runs[]' > checks.ndjson
          else
            : > checks.ndjson
          fi
          node scripts/release.mjs verify --sha "${{ github.sha }}" --tree "$(git rev-parse "HEAD^{tree}")" \
            --head-tree "$head_tree" --prs prs.json --checks checks.ndjson

      - name: Push tag
        if: steps.plan.outputs.action == 'release'
        run: |
          git tag "${{ steps.plan.outputs.tag }}" HEAD
          git push origin "refs/tags/${{ steps.plan.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.plan.outputs.action == 'release' || steps.plan.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --verify-tag --title "${{ steps.plan.outputs.tag }}" --notes-file release-notes.md
