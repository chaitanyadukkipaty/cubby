name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who it affects (admins, friends using apps, agents).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      description: See CONTRIBUTING.md. It's fine if you're unsure.
      options:
        - label: An agent could use this through the CLI without a person typing commands
        - label: It doesn't delete data implicitly or weaken isolation between apps
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
